<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meaningless Fantasy Football League 2026</title>
<link rel="stylesheet" href="css/styles.css?v=20261023a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101014">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFFL">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/loaders/TTFLoader.js": "./js/vendor/TTFLoader.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="bg3d" aria-hidden="true"></div>
  <div id="bg-tint" aria-hidden="true"></div>
  <div id="bg-fallback" aria-hidden="true"></div>

  <div id="app">
    <!-- SCORES -->
    <section id="scores-wrap">
      <div id="helmet-wrap"><img id="leader-helmet" src="assets/img/helmet-hxzero.png" alt="Leader helmet">
      </div>
      <main id="leaderboard" aria-label="Leaderboard"></main>
      <section id="roster-view" hidden>
        <div class="roster-scroll" id="roster-scroll">
        <div class="roster-head">
          <img class="badge" id="roster-badge" src="assets/img/team-hxzero.png" alt="">
          <div class="roster-head-main">
            <h2 class="display" id="roster-team-name"></h2>
            <div class="roster-state" id="roster-state"></div>
          </div>
          <div class="roster-total display" id="roster-total"></div>
        </div>
        <div class="lineup-bar">
          <span class="lineup-label display">Team lineup</span>
          <span class="lineup-meta" id="lineup-meta"></span>
        </div>
        <div id="roster-list"></div>
        </div>
        <button id="sheet-close" aria-label="Close lineup"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </section>
    </section>

    <!-- STANDINGS -->
    <section id="standings-view" hidden>
      <header class="s-head">
        <img class="s-logo" id="standings-logo" src="assets/img/icon-192.png" alt="App icon">
      </header>
      <h1 class="league-title">Leaderboard</h1>
      <div id="standings-list"></div>
      <p class="standings-note">Each team's worst week is dropped from their total score.</p>
    </section>

    <div id="scores-bottom-stack">
      <div id="countdown" class="countdown display" hidden></div>
      <div id="week-picker" hidden>
        <button id="week-prev" aria-label="Previous week"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14.5 5.5 8 12 14.5 18.5"/></svg></button>
        <span class="week-name display" id="week-name">WEEK 6</span>
        <button id="week-next" aria-label="Next week"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9.5 5.5 16 12 9.5 18.5"/></svg></button>
        <button id="picker-close" aria-label="Close lineup"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </div>

  <nav id="bottomnav">
    <button id="nav-scores" class="active" aria-current="page">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <span>SCORES</span>
    </button>
    <button id="nav-standings">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="12" width="5" height="9" rx="1"/><rect x="9.5" y="5" width="5" height="16" rx="1"/><rect x="16" y="9" width="5" height="12" rx="1"/></svg>
      <span>STANDINGS</span>
    </button>
  </nav>

  <script src="js/bg3d.js?v=20261023a"></script>
  <script src="js/app.js?v=20261023a"></script>
</body>
</html>
